services:
  - type: web
    name: media-saver-backend
    env: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "5000"
      - key: FLASK_DEBUG
        value: "false"
      # لتجاوز حجب يوتيوب (فحص روبوت) عند الحاجة: أزل التعليق واملأ القيمة
      # - key: YOUTUBE_PROXY
      #   sync: false
      # - key: YOUTUBE_PO_TOKEN
      #   sync: false